<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>碁盤図メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7EBEE; --surface:#FFFFFF; --ink:#1F2A33; --muted:#5C6A75;
  --line:#C6CED5; --accent:#2F5D7C; --accent-ink:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151A1F; --surface:#1E252C; --ink:#E5E9ED; --muted:#9AA6B0;
    --line:#35414B; --accent:#7FB0D0; --accent-ink:#0E1A22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151A1F; --surface:#1E252C; --ink:#E5E9ED; --muted:#9AA6B0;
  --line:#35414B; --accent:#7FB0D0; --accent-ink:#0E1A22;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  font-size:15px; line-height:1.6;
}
main{max-width:600px; margin:0 auto; padding:16px 14px 40px}
h1{font-size:1.25rem; margin:4px 0 2px; letter-spacing:.04em}
.lead{margin:0 0 12px; color:var(--muted); font-size:.85rem}
.board-wrap{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px}
canvas#board{display:block; width:100%; height:auto; touch-action:manipulation; cursor:crosshair; border-radius:4px}
.group{margin-top:12px}
.group-title{font-size:.8rem; color:var(--muted); margin:0 0 6px}
.tools{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
button,select,input{font:inherit; color:inherit}
.tool,.btn{
  background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:8px 4px; min-height:44px; cursor:pointer; font-size:.9rem;
}
.tool[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700}
.tool:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.row label{display:flex; align-items:center; gap:6px; font-size:.9rem}
select,input[type=text],input[type=number]{
  background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px; min-height:40px;
}
input[type=number]{width:72px} input[type=text]{width:60px; text-align:center}
.btn{padding:8px 12px}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700}
.ctx{min-height:44px}
#preview{margin-top:10px; display:none}
#preview img{max-width:100%; border:1px solid var(--line); border-radius:6px; display:block}
#preview p{font-size:.8rem; color:var(--muted); margin:6px 0}
.status{font-size:.8rem; color:var(--muted); min-height:1.2em; margin-top:6px}
</style>
</head>
<body>
<main>
  <h1>碁盤図メーカー</h1>
  <p class="lead">盤をタップして石・番号・記号を置き、PNG画像で保存します。</p>

  <div class="board-wrap"><canvas id="board" aria-label="碁盤"></canvas></div>

  <div class="group">
    <p class="group-title">置くもの</p>
    <div class="tools" id="tools">
      <button class="tool" data-tool="num" aria-pressed="true">番号つき</button>
      <button class="tool" data-tool="B" aria-pressed="false">● 黒</button>
      <button class="tool" data-tool="W" aria-pressed="false">○ 白</button>
      <button class="tool" data-tool="label" aria-pressed="false">a b c</button>
      <button class="tool" data-tool="erase" aria-pressed="false">消す</button>
      <button class="tool" data-tool="tri" aria-pressed="false">△</button>
      <button class="tool" data-tool="sq" aria-pressed="false">□</button>
      <button class="tool" data-tool="circ" aria-pressed="false">◯</button>
      <button class="tool" data-tool="x" aria-pressed="false">×</button>
      <button class="tool" data-tool="dot" aria-pressed="false">・</button>
    </div>
  </div>

  <div class="group ctx" id="ctx"></div>

  <div class="group">
    <p class="group-title">盤の設定</p>
    <div class="row">
      <label>路数
        <select id="size"><option>9</option><option>13</option><option>19</option></select>
      </label>
      <label><input type="checkbox" id="coords" checked> 座標</label>
      <label>盤の色
        <select id="boardColor"><option value="wood">木の色</option><option value="white">白（印刷向け）</option></select>
      </label>
    </div>
    <div class="row" style="margin-top:8px">
      <label>表示範囲
        <select id="viewSel"><option value="all">盤全体</option><option value="tl">左上</option><option value="tr">右上</option><option value="bl">左下</option><option value="br">右下</option><option value="custom">自分で指定</option></select>
      </label>
    </div>
    <div class="row" id="customView" style="margin-top:8px; display:none">
      <label>横 <select id="vx0"></select>〜<select id="vx1"></select></label>
      <label>縦 <select id="vy0"></select>〜<select id="vy1"></select></label>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="undo">1手戻す</button>
      <button class="btn" id="clear">全部消す</button>
    </div>
  </div>

  <div class="group">
    <div class="row">
      <button class="btn primary" id="make">画像を作る</button>
      <button class="btn" id="save" disabled>PNGを保存</button>
    </div>
    <div id="preview">
      <img id="previewImg" alt="作った碁盤図">
      <p>保存ボタンが使えないときは、画像を長押し（右クリック）でも保存できます。</p>
    </div>
    <div class="status" id="status" role="status"></div>
  </div>
</main>

<script>
(function(){
  const KANJI = ['一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九'];
  const STAR = {9:[[2,2],[6,2],[2,6],[6,6],[4,4]],
                13:[[3,3],[9,3],[3,9],[9,9],[6,6]],
                19:[[3,3],[9,3],[15,3],[3,9],[9,9],[15,9],[3,15],[9,15],[15,15]]};
  const BOARD = {wood:'#DCB35C', white:'#FFFFFF'};
  const STORE = 'goban-zu-v1';

  let state = {size:9, stones:{}, marks:{}, nextNum:1, nextColor:'B', label:'a', coords:true, board:'wood', view:null, viewMode:'all'};
  let tool = 'num';
  const hist = [];

  try{ const s = localStorage.getItem(STORE); if(s){ state = Object.assign(state, JSON.parse(s)); } }catch(e){}

  const cv = document.getElementById('board');
  const $ = id => document.getElementById(id);

  function persist(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }
  function snap(){ hist.push(JSON.stringify(state)); if(hist.length>300) hist.shift(); }

  function viewRange(){
    const N = state.size; const v = state.view;
    if(!v) return {x0:0,x1:N-1,y0:0,y1:N-1};
    const c = a => Math.max(0, Math.min(N-1, a|0));
    let x0=c(v.x0), x1=c(v.x1), y0=c(v.y0), y1=c(v.y1);
    if(x0>x1) [x0,x1]=[x1,x0];
    if(y0>y1) [y0,y1]=[y1,y0];
    if(x1===x0){ if(x1<N-1) x1++; else x0--; }
    if(y1===y0){ if(y1<N-1) y1++; else y0--; }
    return {x0,x1,y0,y1};
  }
  function geom(cell){
    const N = state.size; const r = viewRange();
    const m = state.coords ? cell*1.3 : cell*0.75;
    return {N, cell, m, x0:r.x0, x1:r.x1, y0:r.y0, y1:r.y1, W: m*2 + cell*(r.x1-r.x0), H: m*2 + cell*(r.y1-r.y0)};
  }

  function draw(ctx, cell){
    const g = geom(cell); const {N,m,W,H,x0,x1,y0,y1} = g;
    const bg = BOARD[state.board] || BOARD.wood;
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
    const PX = i => m + (i-x0)*cell, PY = j => m + (j-y0)*cell;
    const inView = (x,y) => x>=x0 && x<=x1 && y>=y0 && y<=y1;
    // grid (open sides extend a little past the last line)
    const ext = cell*0.5;
    const xs = x0===0 ? PX(0) : PX(x0)-ext, xe = x1===N-1 ? PX(N-1) : PX(x1)+ext;
    const ys = y0===0 ? PY(0) : PY(y0)-ext, ye = y1===N-1 ? PY(N-1) : PY(y1)+ext;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = Math.max(1, cell*0.025);
    ctx.beginPath();
    for(let j=y0;j<=y1;j++){ ctx.moveTo(xs,PY(j)); ctx.lineTo(xe,PY(j)); }
    for(let i=x0;i<=x1;i++){ ctx.moveTo(PX(i),ys); ctx.lineTo(PX(i),ye); }
    ctx.stroke();
    // thick lines only on the real board edges
    ctx.lineWidth = Math.max(2, cell*0.06); ctx.lineCap = 'square';
    ctx.beginPath();
    if(y0===0){ ctx.moveTo(xs,PY(0)); ctx.lineTo(xe,PY(0)); }
    if(y1===N-1){ ctx.moveTo(xs,PY(N-1)); ctx.lineTo(xe,PY(N-1)); }
    if(x0===0){ ctx.moveTo(PX(0),ys); ctx.lineTo(PX(0),ye); }
    if(x1===N-1){ ctx.moveTo(PX(N-1),ys); ctx.lineTo(PX(N-1),ye); }
    ctx.stroke(); ctx.lineCap = 'butt';
    // star points
    ctx.fillStyle = '#000';
    (STAR[N]||[]).forEach(([x,y])=>{ if(!inView(x,y)) return; ctx.beginPath(); ctx.arc(PX(x),PY(y),cell*0.09,0,Math.PI*2); ctx.fill(); });
    // coordinates
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(state.coords){
      ctx.fillStyle = '#000';
      ctx.font = `${cell*0.36}px "Hiragino Sans","Yu Gothic",Arial,sans-serif`;
      for(let i=x0;i<=x1;i++) ctx.fillText(String(i+1), PX(i), m - cell*0.85);
      for(let j=y0;j<=y1;j++) ctx.fillText(KANJI[j], m - cell*0.85, PY(j));
    }
    // stones
    const r = cell*0.47;
    for(const k in state.stones){
      const [x,y] = k.split(',').map(Number); if(!inView(x,y)) continue;
      const s = state.stones[k];
      ctx.beginPath(); ctx.arc(PX(x),PY(y),r,0,Math.PI*2);
      ctx.fillStyle = s.c==='B' ? '#000' : '#FFF'; ctx.fill();
      ctx.lineWidth = Math.max(1, cell*0.04); ctx.strokeStyle='#000'; ctx.stroke();
      if(s.n){
        const t = String(s.n);
        const fs = t.length===1 ? 0.56 : t.length===2 ? 0.46 : 0.36;
        ctx.fillStyle = s.c==='B' ? '#FFF' : '#000';
        ctx.font = `bold ${cell*fs}px Arial,"Helvetica Neue",sans-serif`;
        ctx.fillText(t, PX(x), PY(y)+cell*0.02);
      }
    }
    // marks
    for(const k in state.marks){
      const [x,y] = k.split(',').map(Number); if(!inView(x,y)) continue;
      const mk = state.marks[k]; const st = state.stones[k];
      const col = st && st.c==='B' ? '#FFF' : '#000';
      const cx=PX(x), cy=PY(y);
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = Math.max(1.5, cell*0.06);
      if(mk.t==='L'){
        if(!st){ ctx.beginPath(); ctx.arc(cx,cy,cell*0.36,0,Math.PI*2); ctx.fillStyle=bg; ctx.fill(); ctx.fillStyle=col; }
        ctx.font = `${cell*0.6}px Georgia,"Times New Roman",serif`;
        ctx.font = `italic ${cell*(mk.v.length>1?0.46:0.6)}px Georgia,"Times New Roman",serif`;
        ctx.fillText(mk.v, cx, cy - cell*0.03);
      } else if(mk.t==='tri'){
        const s=cell*0.27; ctx.beginPath();
        ctx.moveTo(cx,cy-s); ctx.lineTo(cx+s*0.95,cy+s*0.62); ctx.lineTo(cx-s*0.95,cy+s*0.62); ctx.closePath(); ctx.stroke();
      } else if(mk.t==='sq'){
        const s=cell*0.21; ctx.strokeRect(cx-s,cy-s,s*2,s*2);
      } else if(mk.t==='circ'){
        ctx.beginPath(); ctx.arc(cx,cy,cell*0.22,0,Math.PI*2); ctx.stroke();
      } else if(mk.t==='x'){
        const s=cell*0.2; ctx.beginPath();
        ctx.moveTo(cx-s,cy-s); ctx.lineTo(cx+s,cy+s); ctx.moveTo(cx+s,cy-s); ctx.lineTo(cx-s,cy+s); ctx.stroke();
      } else if(mk.t==='dot'){
        ctx.beginPath(); ctx.arc(cx,cy,cell*0.12,0,Math.PI*2); ctx.fill();
      }
    }
    return W;
  }

  let dispCell = 40;
  function render(){
    const dpr = window.devicePixelRatio || 1;
    dispCell = (state.size===19 ? 26 : state.size===13 ? 34 : 44) * dpr;
    const g0 = geom(dispCell);
    cv.width = Math.round(g0.W); cv.height = Math.round(g0.H);
    draw(cv.getContext('2d'), dispCell);
    renderCtx();
    updateViewUI();
    persist();
  }

  function nextLabel(v){
    if(/^[a-y]$/.test(v) || /^[A-Y]$/.test(v)) return String.fromCharCode(v.charCodeAt(0)+1);
    if(v==='z') return 'a'; if(v==='Z') return 'A';
    if(/^\d+$/.test(v)) return String(Number(v)+1);
    return v;
  }

  function act(x,y){
    const k = x+','+y; const s = state.stones[k]; const mk = state.marks[k];
    const before = JSON.stringify(state);
    if(tool==='B' || tool==='W'){
      if(s && s.c===tool && !s.n) delete state.stones[k]; else state.stones[k] = {c:tool};
    } else if(tool==='num'){
      if(s) return;
      state.stones[k] = {c:state.nextColor, n:state.nextNum};
      state.nextNum++; state.nextColor = state.nextColor==='B' ? 'W' : 'B';
    } else if(tool==='label'){
      if(mk && mk.t==='L') delete state.marks[k];
      else { const v = (state.label||'a').slice(0,3); state.marks[k] = {t:'L', v}; state.label = nextLabel(v); }
    } else if(tool==='erase'){
      delete state.stones[k]; delete state.marks[k];
    } else {
      if(mk && mk.t===tool) delete state.marks[k]; else state.marks[k] = {t:tool};
    }
    const after = JSON.stringify(state);
    if(after!==before){ hist.push(before); if(hist.length>300) hist.shift(); render(); }
  }

  cv.addEventListener('click', e=>{
    const rect = cv.getBoundingClientRect();
    const px = (e.clientX - rect.left) * cv.width / rect.width;
    const py = (e.clientY - rect.top) * cv.height / rect.height;
    const g = geom(dispCell);
    const x = Math.round((px - g.m)/g.cell) + g.x0, y = Math.round((py - g.m)/g.cell) + g.y0;
    if(x<g.x0||y<g.y0||x>g.x1||y>g.y1) return;
    act(x,y);
  });

  function renderCtx(){
    const box = $('ctx');
    if(tool==='num'){
      box.innerHTML = `<p class="group-title">番号つきの石</p>
        <div class="row">
          <button class="btn" id="flip">次は ${state.nextColor==='B'?'● 黒':'○ 白'}（タップで入れ替え）</button>
          <label>次の番号 <input type="number" id="nextNum" min="1" value="${state.nextNum}"></label>
        </div>`;
      $('flip').onclick = ()=>{ snap(); state.nextColor = state.nextColor==='B'?'W':'B'; render(); };
      $('nextNum').onchange = e=>{ const v = parseInt(e.target.value,10); if(v>0){ snap(); state.nextNum=v; render(); } };
    } else if(tool==='label'){
      box.innerHTML = `<p class="group-title">文字の記号</p>
        <div class="row"><label>次に置く文字 <input type="text" id="labelIn" maxlength="3" value="${state.label.replace(/"/g,'&quot;')}"></label>
        <button class="btn" id="labelReset">a に戻す</button></div>`;
      $('labelIn').oninput = e=>{ state.label = e.target.value || 'a'; persist(); };
      $('labelReset').onclick = ()=>{ state.label='a'; render(); };
    } else {
      const tips = {B:'同じ色の石をもう一度タップすると消えます。', W:'同じ色の石をもう一度タップすると消えます。',
        erase:'タップした点の石と記号を消します。'};
      box.innerHTML = `<p class="group-title">${tips[tool] || '同じ記号をもう一度タップすると消えます。石の上にも置けます。'}</p>`;
    }
  }

  document.querySelectorAll('.tool').forEach(b=>{
    b.addEventListener('click', ()=>{
      tool = b.dataset.tool;
      document.querySelectorAll('.tool').forEach(t=>t.setAttribute('aria-pressed', t===b ? 'true':'false'));
      renderCtx();
    });
  });

  function presetView(mode){
    const N = state.size, h = Math.min(N, Math.ceil(N/2)+1);
    if(mode==='all') return null;
    if(mode==='custom') return state.view || {x0:0,x1:N-1,y0:0,y1:N-1};
    const lo=[0,h-1], hi=[N-h,N-1];
    const xr = mode[1]==='l' ? lo : hi, yr = mode[0]==='t' ? lo : hi;
    return {x0:xr[0], x1:xr[1], y0:yr[0], y1:yr[1]};
  }
  function fillSel(sel, labels, val){
    sel.innerHTML = labels.map((t,i)=>`<option value="${i}">${t}</option>`).join('');
    sel.value = String(val);
  }
  function updateViewUI(){
    const mode = state.viewMode || 'all';
    $('viewSel').value = mode;
    $('customView').style.display = mode==='custom' ? 'flex' : 'none';
    if(mode==='custom'){
      const N = state.size, r = viewRange();
      const nums = Array.from({length:N},(_,i)=>String(i+1)), kan = KANJI.slice(0,N);
      fillSel($('vx0'),nums,r.x0); fillSel($('vx1'),nums,r.x1);
      fillSel($('vy0'),kan,r.y0); fillSel($('vy1'),kan,r.y1);
    }
  }
  $('viewSel').onchange = e=>{ snap(); state.viewMode = e.target.value; state.view = presetView(state.viewMode); render(); };
  ['vx0','vx1','vy0','vy1'].forEach(id=>{
    $(id).onchange = ()=>{ snap(); state.view = {x0:+$('vx0').value, x1:+$('vx1').value, y0:+$('vy0').value, y1:+$('vy1').value}; render(); };
  });

  $('size').value = String(state.size);
  $('coords').checked = state.coords;
  $('boardColor').value = state.board;

  $('size').onchange = e=>{
    const n = parseInt(e.target.value,10);
    const used = Object.keys(state.stones).length + Object.keys(state.marks).length;
    if(used && !confirm('路数を変えると盤の上のものはすべて消えます。変えますか？')){ e.target.value = String(state.size); return; }
    snap(); state.size=n; if(state.viewMode==='custom') state.viewMode='all'; state.view=presetView(state.viewMode||'all'); state.stones={}; state.marks={}; state.nextNum=1; state.nextColor='B'; state.label='a'; render();
  };
  $('coords').onchange = e=>{ snap(); state.coords = e.target.checked; render(); };
  $('boardColor').onchange = e=>{ snap(); state.board = e.target.value; render(); };
  $('undo').onclick = ()=>{ if(!hist.length) return; state = JSON.parse(hist.pop()); $('size').value=String(state.size); $('coords').checked=state.coords; $('boardColor').value=state.board; render(); };
  $('clear').onclick = ()=>{
    if(!confirm('盤の上の石と記号をすべて消しますか？')) return;
    snap(); state.stones={}; state.marks={}; state.nextNum=1; state.nextColor='B'; state.label='a'; render();
  };

  // export
  let lastBlob = null;
  $('make').onclick = ()=>{
    const cell = 64;
    const gg = geom(cell); const W = Math.round(gg.W), H = Math.round(gg.H);
    const off = document.createElement('canvas'); off.width=W; off.height=H;
    draw(off.getContext('2d'), cell);
    $('previewImg').src = off.toDataURL('image/png');
    $('preview').style.display='block';
    off.toBlob(b=>{ lastBlob=b; $('save').disabled=false; $('status').textContent = `画像を作りました（${W}×${H}px）。`; }, 'image/png');
  };

  let dlPromise = null;
  function getDownloads(){
    if(!window.claude || typeof window.claude.use!=='function') return Promise.resolve(null);
    if(!dlPromise) dlPromise = Promise.resolve(window.claude.use('downloads')).catch(()=>null);
    return dlPromise;
  }
  $('save').onclick = async ()=>{
    if(!lastBlob) return;
    const name = `goban-${state.size}ro-${Date.now()}.png`;
    const dl = await getDownloads();
    if(dl){
      try{ await dl.save({filename:name, data:lastBlob}); $('status').textContent='保存しました。'; }
      catch(err){ $('status').textContent = err && err.code==='declined' ? '保存をキャンセルしました。' : '保存できませんでした。画像を長押しして保存してください。'; }
      return;
    }
    const url = URL.createObjectURL(lastBlob);
    const a = document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    $('status').textContent='保存しました。';
  };

  window.addEventListener('resize', ()=>{});
  render();
})();
</script>
</body>
</html>
